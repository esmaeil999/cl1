name: Export JForex Ticks (year by year)

# For long ranges (e.g. 2010..2020) a single job will hit the 6-hour limit.
# This workflow runs one job per year in parallel, each producing its own file.

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: "Instrument (e.g. EURUSD)"
        required: true
        default: "EURUSD"
      years:
        description: 'JSON list of years, e.g. ["2010","2011","2012"]'
        required: true
        default: '["2010","2011","2012","2013","2014"]'
      account_type:
        description: "DEMO or LIVE"
        required: false
        default: "DEMO"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.set.outputs.years }}
    steps:
      - id: set
        run: echo "years=${{ github.event.inputs.years }}" >> "$GITHUB_OUTPUT"

  export:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2   # be gentle with the Dukascopy history feed
      matrix:
        year: ${{ fromJSON(needs.prepare.outputs.years) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - run: mvn -B -ntp clean package

      - name: Export ${{ matrix.year }}
        env:
          DUKASCOPY_USERNAME: ${{ secrets.DUKASCOPY_USERNAME }}
          DUKASCOPY_PASSWORD: ${{ secrets.DUKASCOPY_PASSWORD }}
          DUKASCOPY_ACCOUNT_TYPE: ${{ github.event.inputs.account_type || 'DEMO' }}
          INSTRUMENT: ${{ github.event.inputs.instrument }}
          DATE_FROM: ${{ matrix.year }}-01-01 00:00:00
          DATE_TO: ${{ matrix.year }}-12-31 23:59:59
          OUT_FILE: out/${{ github.event.inputs.instrument }}_ticks_${{ matrix.year }}.csv.gz
          CHUNK_HOURS: "6"
          GZIP: "true"
          RUN_TIMEOUT_HOURS: "5"
        run: java -Xmx2g -jar target/tick-exporter.jar

      - name: Upload ${{ matrix.year }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticks-${{ github.event.inputs.instrument }}-${{ matrix.year }}
          path: out/**
          if-no-files-found: warn
          retention-days: 14
